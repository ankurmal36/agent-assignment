name: CloudOps Sentinel CI & Agent Evaluation Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -e .

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Unit Tests & Golden Dataset Regression Evaluation Suite
        run: |
          pytest -v
